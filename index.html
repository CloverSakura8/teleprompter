<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Teleprompter">
<meta name="robots" content="noindex, nofollow">
<title>Teleprompter</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
  }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

  /* ============ PIN VIEW ============ */
  .pin-view {
    height: 100vh; height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
    gap: 24px;
  }
  .pin-view.hidden { display: none; }
  .pin-title {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .pin-sub {
    font-size: 14px;
    color: #888;
    text-align: center;
    max-width: 320px;
  }
  .pin-input {
    width: 240px;
    background: #1A1A1A;
    color: #fff;
    border: 1px solid #2A2A2A;
    border-radius: 12px;
    padding: 18px 20px;
    font-size: 28px;
    text-align: center;
    letter-spacing: 0.5em;
    font-family: inherit;
    font-weight: 600;
    outline: none;
    -webkit-appearance: none;
  }
  .pin-input:focus { border-color: #555; }
  .pin-submit {
    width: 240px;
    padding: 16px;
    background: #fff;
    color: #000;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    -webkit-appearance: none;
  }
  .pin-submit:active { background: #ddd; }
  .pin-submit:disabled { background: #444; color: #888; }
  .pin-error {
    font-size: 14px;
    color: #FF6B6B;
    font-weight: 500;
    min-height: 20px;
  }

  /* ============ SETUP VIEW ============ */
  .setup {
    height: 100vh; height: 100dvh;
    display: none;
    flex-direction: column;
    padding: 24px 20px;
    gap: 16px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    position: relative;
  }
  .setup.active { display: flex; }
  .setup-title {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
  }
  .setup-sub {
    font-size: 14px;
    color: #888;
    margin-bottom: 8px;
  }
  .script-input {
    flex: 1 1 auto;
    min-height: 200px;
    width: 100%;
    background: #1A1A1A;
    color: #fff;
    border: 1px solid #2A2A2A;
    border-radius: 12px;
    padding: 16px;
    font-size: 16px;
    font-family: inherit;
    line-height: 1.5;
    resize: none;
    outline: none;
    -webkit-appearance: none;
  }
  .script-input:focus { border-color: #555; }

  .control-row {
    display: flex; align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 0;
  }
  .control-label {
    font-size: 14px;
    color: #aaa;
    flex-shrink: 0;
    min-width: 80px;
  }
  .control-value {
    font-size: 14px;
    color: #fff;
    font-weight: 600;
    min-width: 56px;
    text-align: right;
  }
  input[type=range] {
    flex: 1;
    -webkit-appearance: none; appearance: none;
    height: 4px;
    background: #333;
    border-radius: 2px;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 24px; height: 24px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
  }
  .toggle-row {
    display: flex; align-items: center;
    justify-content: space-between;
    padding: 8px 0;
  }
  .toggle {
    position: relative;
    width: 52px; height: 30px;
    background: #333;
    border-radius: 15px;
    cursor: pointer;
    transition: background 200ms;
  }
  .toggle.on { background: #4CAF50; }
  .toggle::after {
    content: '';
    position: absolute;
    top: 3px; left: 3px;
    width: 24px; height: 24px;
    background: #fff;
    border-radius: 50%;
    transition: transform 200ms;
  }
  .toggle.on::after { transform: translateX(22px); }

  .start-btn {
    width: 100%;
    padding: 18px;
    background: #fff;
    color: #000;
    border: none;
    border-radius: 14px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 12px;
    -webkit-appearance: none;
  }
  .start-btn:active { background: #ddd; }

  /* ============ RUNNING VIEW ============ */
  .running {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    overflow: hidden;
  }
  .running.active { display: block; }

  .scroll-area {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }
  .script-text {
    position: absolute;
    left: 0; right: 0;
    will-change: transform;
    padding: 100vh 32px 100vh;
    font-size: 56px;
    line-height: 1.4;
    color: #fff;
    font-weight: 600;
    white-space: pre-wrap;
    word-wrap: break-word;
    letter-spacing: -0.005em;
  }
  .running.mirrored .script-text { transform-origin: center; }
  .running.mirrored .scroll-area { transform: scaleX(-1); }

  .reading-line {
    position: absolute;
    left: 0; right: 0;
    top: 50%;
    height: 2px;
    background: linear-gradient(to right, transparent, rgba(255, 200, 100, 0.4), transparent);
    pointer-events: none;
    z-index: 5;
  }

  .controls {
    position: absolute;
    bottom: env(safe-area-inset-bottom);
    left: 0; right: 0;
    padding: 16px 20px 24px;
    background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: opacity 250ms;
    z-index: 10;
  }
  .controls.hidden { opacity: 0; pointer-events: none; }

  .ctrl-row {
    display: flex; align-items: center;
    gap: 10px;
  }
  .ctrl-btn {
    flex: 1;
    padding: 14px 8px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    -webkit-appearance: none;
    text-align: center;
  }
  .ctrl-btn:active { background: rgba(255,255,255,0.2); }
  .ctrl-btn.primary { background: #fff; color: #000; border-color: #fff; }
  .ctrl-btn.primary:active { background: #ddd; }

  .status-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: #aaa;
    padding: 0 4px;
  }
  .status-line .indicator {
    display: flex; align-items: center; gap: 6px;
  }
  .indicator-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #4CAF50;
  }
  .indicator-dot.paused { background: #FF9500; }

  .countdown {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 240px;
    font-weight: 800;
    color: #fff;
    background: rgba(0,0,0,0.9);
    z-index: 20;
    letter-spacing: -0.05em;
  }
  .countdown.active { display: flex; }
</style>
</head>
<body>

<!-- ============ PIN VIEW ============ -->
<div class="pin-view" id="pinView">
  <div class="pin-title">Teleprompter</div>
  <div class="pin-sub" id="pinSub">Enter PIN to unlock the script.</div>
  <input
    class="pin-input"
    type="password"
    inputmode="numeric"
    pattern="[0-9]*"
    id="pinInput"
    maxlength="16"
    autocomplete="off"
    autocorrect="off"
    spellcheck="false"
  >
  <button class="pin-submit" id="pinSubmit">Unlock</button>
  <div class="pin-error" id="pinError"></div>
</div>

<!-- ============ SETUP VIEW ============ -->
<div class="setup" id="setupView">
  <div class="setup-title">Teleprompter</div>
  <div class="setup-sub">Tap Start. Tap the screen to pause/resume. Drag or scroll to course-correct the position mid-read — auto-scroll resumes after 1.5s.</div>

  <textarea
    class="script-input"
    id="scriptInput"
    placeholder="Paste your script here…"
    spellcheck="false"
    autocorrect="off"
    autocapitalize="off"
  ></textarea>

  <div class="control-row">
    <span class="control-label">Font size</span>
    <input type="range" id="fontSize" min="32" max="96" step="2" value="56">
    <span class="control-value" id="fontSizeVal">56pt</span>
  </div>

  <div class="control-row">
    <span class="control-label">Scroll speed</span>
    <input type="range" id="scrollSpeed" min="20" max="200" step="5" value="60">
    <span class="control-value" id="scrollSpeedVal">60</span>
  </div>

  <div class="toggle-row">
    <span class="control-label">Mirror mode</span>
    <div class="toggle" id="mirrorToggle" role="switch" aria-checked="false"></div>
  </div>

  <div class="toggle-row">
    <span class="control-label">3-2-1 countdown</span>
    <div class="toggle on" id="countdownToggle" role="switch" aria-checked="true"></div>
  </div>

  <button class="start-btn" id="startBtn">Start</button>
</div>

<!-- ============ RUNNING VIEW ============ -->
<div class="running" id="runningView">
  <div class="scroll-area" id="scrollArea">
    <div class="script-text" id="scriptText"></div>
  </div>
  <div class="reading-line"></div>

  <div class="countdown" id="countdown"></div>

  <div class="controls" id="controls">
    <div class="status-line">
      <div class="indicator">
        <div class="indicator-dot" id="statusDot"></div>
        <span id="statusText">Running</span>
      </div>
      <span id="speedReadout">60 px/s · 56pt</span>
    </div>
    <div class="ctrl-row">
      <button class="ctrl-btn" id="sizeDown">A−</button>
      <button class="ctrl-btn" id="sizeUp">A+</button>
      <button class="ctrl-btn" id="speedDown">Slower</button>
      <button class="ctrl-btn" id="speedUp">Faster</button>
    </div>
    <div class="ctrl-row">
      <button class="ctrl-btn" id="resetBtn">Reset to top</button>
      <button class="ctrl-btn primary" id="pauseBtn">Pause</button>
      <button class="ctrl-btn" id="exitBtn">Exit</button>
    </div>
  </div>
</div>

<script>
  // ============================================================
  // ENCRYPTED SCRIPT BLOB
  // ============================================================
  // Set by the maintainer (Claude) per video. Format:
  //   base64(salt(16 bytes) || iv(12 bytes) || ciphertext + AES-GCM auth tag)
  // Encryption: AES-256-GCM, key derived from PIN via PBKDF2-SHA256 @ 250k iterations.
  // If empty string, PIN gate is skipped and the setup view opens with an empty script.
  const SCRIPT_BLOB = '';
  const PBKDF2_ITERATIONS = 250000;

  // -------- Crypto helpers (Web Crypto API) --------
  function base64ToBytes(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  async function deriveKey(pin, salt) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      'raw', enc.encode(pin), { name: 'PBKDF2' }, false, ['deriveKey']
    );
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: PBKDF2_ITERATIONS, hash: 'SHA-256' },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );
  }

  async function decryptScript(pin, blobBase64) {
    const blob = base64ToBytes(blobBase64);
    if (blob.length < 16 + 12 + 16) throw new Error('Blob too short');
    const salt = blob.slice(0, 16);
    const iv = blob.slice(16, 28);
    const ciphertextWithTag = blob.slice(28);
    const key = await deriveKey(pin, salt);
    const plaintext = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv },
      key,
      ciphertextWithTag
    );
    return new TextDecoder().decode(plaintext);
  }

  // ============================================================
  // STATE
  // ============================================================
  const state = {
    script: '',           // in-memory only; never persisted
    fontSize: 56,
    speed: 60,            // px / second
    mirror: false,
    countdown: true,
    running: false,
    paused: false,
    position: 0,
    lastTimestamp: null,
    controlsHideTimer: null,
  };

  // -------- LocalStorage (settings only — never the script) --------
  const STORAGE_KEY = 'tanya-teleprompter-v2';
  function loadSettings() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      if (saved.fontSize) state.fontSize = saved.fontSize;
      if (saved.speed) state.speed = saved.speed;
      if (typeof saved.mirror === 'boolean') state.mirror = saved.mirror;
      if (typeof saved.countdown === 'boolean') state.countdown = saved.countdown;
    } catch (e) {}
  }
  function saveSettings() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      fontSize: state.fontSize,
      speed: state.speed,
      mirror: state.mirror,
      countdown: state.countdown,
    }));
  }

  // ============================================================
  // ELEMENTS
  // ============================================================
  const pinView = document.getElementById('pinView');
  const pinSub = document.getElementById('pinSub');
  const pinInput = document.getElementById('pinInput');
  const pinSubmit = document.getElementById('pinSubmit');
  const pinError = document.getElementById('pinError');

  const setupView = document.getElementById('setupView');
  const scriptInput = document.getElementById('scriptInput');
  const fontSizeSlider = document.getElementById('fontSize');
  const fontSizeVal = document.getElementById('fontSizeVal');
  const speedSlider = document.getElementById('scrollSpeed');
  const speedVal = document.getElementById('scrollSpeedVal');
  const mirrorToggle = document.getElementById('mirrorToggle');
  const countdownToggle = document.getElementById('countdownToggle');
  const startBtn = document.getElementById('startBtn');

  const runningView = document.getElementById('runningView');
  const scriptText = document.getElementById('scriptText');
  const scrollArea = document.getElementById('scrollArea');
  const countdownEl = document.getElementById('countdown');
  const controls = document.getElementById('controls');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const speedReadout = document.getElementById('speedReadout');

  // ============================================================
  // PIN UNLOCK FLOW
  // ============================================================
  async function attemptUnlock() {
    const pin = pinInput.value.trim();
    if (!pin) {
      pinInput.focus();
      return;
    }
    pinSubmit.disabled = true;
    pinSubmit.textContent = 'Decrypting…';
    pinError.textContent = '';
    try {
      const plaintext = await decryptScript(pin, SCRIPT_BLOB);
      enterSetup(plaintext);
    } catch (e) {
      pinError.textContent = 'Incorrect PIN. Try again.';
      pinInput.value = '';
      pinInput.focus();
    } finally {
      pinSubmit.disabled = false;
      pinSubmit.textContent = 'Unlock';
    }
  }

  pinSubmit.addEventListener('click', attemptUnlock);
  pinInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') attemptUnlock();
  });

  function enterSetup(scriptText) {
    state.script = scriptText;
    scriptInput.value = scriptText;
    pinInput.value = '';
    pinError.textContent = '';
    pinView.classList.add('hidden');
    setupView.classList.add('active');
  }

  // ============================================================
  // SETUP VIEW BINDINGS
  // ============================================================
  function applySettingsToInputs() {
    fontSizeSlider.value = state.fontSize;
    fontSizeVal.textContent = state.fontSize + 'pt';
    speedSlider.value = state.speed;
    speedVal.textContent = state.speed;
    mirrorToggle.classList.toggle('on', state.mirror);
    countdownToggle.classList.toggle('on', state.countdown);
  }

  scriptInput.addEventListener('input', () => {
    state.script = scriptInput.value;
  });
  fontSizeSlider.addEventListener('input', () => {
    state.fontSize = parseInt(fontSizeSlider.value, 10);
    fontSizeVal.textContent = state.fontSize + 'pt';
    saveSettings();
  });
  speedSlider.addEventListener('input', () => {
    state.speed = parseInt(speedSlider.value, 10);
    speedVal.textContent = state.speed;
    saveSettings();
  });
  mirrorToggle.addEventListener('click', () => {
    state.mirror = !state.mirror;
    mirrorToggle.classList.toggle('on', state.mirror);
    saveSettings();
  });
  countdownToggle.addEventListener('click', () => {
    state.countdown = !state.countdown;
    countdownToggle.classList.toggle('on', state.countdown);
    saveSettings();
  });

  startBtn.addEventListener('click', () => {
    if (!state.script.trim()) {
      scriptInput.focus();
      return;
    }
    enterRunning();
  });

  // ============================================================
  // RUNNING VIEW
  // ============================================================
  function enterRunning() {
    setupView.classList.remove('active');
    runningView.classList.add('active');
    runningView.classList.toggle('mirrored', state.mirror);

    scriptText.textContent = state.script;
    scriptText.style.fontSize = state.fontSize + 'px';

    state.position = 0;
    scriptText.style.transform = 'translateY(0)';

    try {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }
    } catch (e) {}

    if (state.countdown) {
      runCountdown(() => startScrolling());
    } else {
      startScrolling();
    }
    scheduleControlsHide();
  }

  function runCountdown(onDone) {
    countdownEl.classList.add('active');
    let n = 3;
    countdownEl.textContent = n;
    const interval = setInterval(() => {
      n--;
      if (n > 0) {
        countdownEl.textContent = n;
      } else {
        clearInterval(interval);
        countdownEl.classList.remove('active');
        onDone();
      }
    }, 1000);
  }

  function startScrolling() {
    state.running = true;
    state.paused = false;
    state.lastTimestamp = null;
    statusDot.classList.remove('paused');
    statusText.textContent = 'Running';
    document.getElementById('pauseBtn').textContent = 'Pause';
    requestAnimationFrame(tick);
  }

  function tick(timestamp) {
    if (!state.running) return;
    if (state.paused) return;
    if (state.lastTimestamp === null) state.lastTimestamp = timestamp;
    const dt = (timestamp - state.lastTimestamp) / 1000;
    state.lastTimestamp = timestamp;
    state.position += state.speed * dt;
    scriptText.style.transform = `translateY(${-state.position}px)`;
    requestAnimationFrame(tick);
  }

  function togglePause() {
    if (!state.running) return;
    state.paused = !state.paused;
    statusDot.classList.toggle('paused', state.paused);
    statusText.textContent = state.paused ? 'Paused' : 'Running';
    document.getElementById('pauseBtn').textContent = state.paused ? 'Resume' : 'Pause';
    if (!state.paused) {
      state.lastTimestamp = null;
      requestAnimationFrame(tick);
    }
  }

  // ============================================================
  // MANUAL SCROLL OVERRIDE
  // ============================================================
  // Wheel (mac trackpad / mouse) + touch drag (iPhone) lets the user
  // course-correct mid-scroll. Auto-scroll pauses briefly during manual input,
  // then resumes from the new position. The two don't fight each other.
  const MANUAL_RESUME_MS = 1500;
  let manualResumeTimer = null;
  let manualWasAutoScrolling = false;
  let touchStartY = null;
  let touchLastY = null;
  let touchHasMoved = false;
  const TOUCH_MOVE_THRESHOLD = 8; // px before a finger drag counts as a scroll, not a tap

  function manualScrollBegin() {
    if (state.running && !state.paused) {
      manualWasAutoScrolling = true;
      state.paused = true;
      statusDot.classList.add('paused');
      statusText.textContent = 'Manual';
      document.getElementById('pauseBtn').textContent = 'Resume';
    }
    if (manualResumeTimer) { clearTimeout(manualResumeTimer); manualResumeTimer = null; }
  }
  function manualScrollEnd() {
    if (manualResumeTimer) clearTimeout(manualResumeTimer);
    manualResumeTimer = setTimeout(() => {
      if (manualWasAutoScrolling && state.running && state.paused) {
        state.paused = false;
        state.lastTimestamp = null;
        statusDot.classList.remove('paused');
        statusText.textContent = 'Running';
        document.getElementById('pauseBtn').textContent = 'Pause';
        requestAnimationFrame(tick);
      }
      manualWasAutoScrolling = false;
    }, MANUAL_RESUME_MS);
  }
  function applyManualDelta(deltaY) {
    state.position += deltaY;
    if (state.position < 0) state.position = 0;
    scriptText.style.transform = `translateY(${-state.position}px)`;
  }

  // Wheel: mac trackpad / external mouse / iPad pointer
  scrollArea.addEventListener('wheel', (e) => {
    e.preventDefault();
    manualScrollBegin();
    applyManualDelta(e.deltaY);
    manualScrollEnd();
  }, { passive: false });

  // Touch: iPhone drag-to-scroll
  scrollArea.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      touchStartY = e.touches[0].clientY;
      touchLastY = touchStartY;
      touchHasMoved = false;
    }
  }, { passive: true });
  scrollArea.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1 && touchStartY !== null) {
      const currentY = e.touches[0].clientY;
      if (Math.abs(currentY - touchStartY) > TOUCH_MOVE_THRESHOLD) {
        if (!touchHasMoved) manualScrollBegin();
        touchHasMoved = true;
        e.preventDefault();
        const stepDelta = touchLastY - currentY;
        applyManualDelta(stepDelta);
        touchLastY = currentY;
      }
    }
  }, { passive: false });
  scrollArea.addEventListener('touchend', () => {
    if (touchHasMoved) manualScrollEnd();
    touchStartY = null;
    touchLastY = null;
    // touchHasMoved cleared after the synthetic click would have fired so the
    // click handler below can see whether this was a tap or a drag-scroll.
    setTimeout(() => { touchHasMoved = false; }, 50);
  }, { passive: true });

  // Tap-to-pause (only fires for taps, not drag-scrolls)
  scrollArea.addEventListener('click', () => {
    if (touchHasMoved) return;
    togglePause();
    showControls();
  });

  document.getElementById('pauseBtn').addEventListener('click', (e) => {
    e.stopPropagation(); togglePause(); showControls();
  });
  document.getElementById('resetBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    state.position = 0;
    scriptText.style.transform = 'translateY(0)';
    showControls();
  });
  document.getElementById('exitBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    state.running = false;
    runningView.classList.remove('active');
    setupView.classList.add('active');
  });

  document.getElementById('sizeUp').addEventListener('click', (e) => {
    e.stopPropagation();
    state.fontSize = Math.min(120, state.fontSize + 4);
    scriptText.style.fontSize = state.fontSize + 'px';
    updateReadout(); saveSettings(); showControls();
  });
  document.getElementById('sizeDown').addEventListener('click', (e) => {
    e.stopPropagation();
    state.fontSize = Math.max(24, state.fontSize - 4);
    scriptText.style.fontSize = state.fontSize + 'px';
    updateReadout(); saveSettings(); showControls();
  });
  document.getElementById('speedUp').addEventListener('click', (e) => {
    e.stopPropagation();
    state.speed = Math.min(300, state.speed + 10);
    updateReadout(); saveSettings(); showControls();
  });
  document.getElementById('speedDown').addEventListener('click', (e) => {
    e.stopPropagation();
    state.speed = Math.max(10, state.speed - 10);
    updateReadout(); saveSettings(); showControls();
  });

  function updateReadout() {
    speedReadout.textContent = `${state.speed} px/s · ${state.fontSize}pt`;
  }

  function showControls() {
    controls.classList.remove('hidden');
    scheduleControlsHide();
  }
  function scheduleControlsHide() {
    if (state.controlsHideTimer) clearTimeout(state.controlsHideTimer);
    state.controlsHideTimer = setTimeout(() => {
      if (!state.paused) controls.classList.add('hidden');
    }, 3000);
  }

  // Prevent iOS rubber-band on areas OUTSIDE the scrollArea (the scrollArea
  // handles its own touchmove for manual scroll above).
  document.addEventListener('touchmove', (e) => {
    if (runningView.classList.contains('active') && !scrollArea.contains(e.target)) {
      e.preventDefault();
    }
  }, { passive: false });

  // ============================================================
  // INIT
  // ============================================================
  loadSettings();
  applySettingsToInputs();
  updateReadout();

  if (SCRIPT_BLOB) {
    // PIN gate required — pinView shown by default
    setTimeout(() => pinInput.focus(), 100);
  } else {
    // No script staged — skip PIN gate, open setup with empty script
    pinView.classList.add('hidden');
    setupView.classList.add('active');
    pinSub.textContent = '';
  }
</script>
</body>
</html>
